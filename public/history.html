<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analysis History - Brain Tumor Detection</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f1b3a 0%, #2d1b69 50%, #1a0f3d 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    
    h2 {
      text-align: center;
      background: linear-gradient(135deg, #1e1a60, #6a11cb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 30px;
      font-size: 32px;
    }
    
    .actions {
      text-align: center;
      margin-bottom: 25px;
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    button {
      padding: 12px 24px;
      border: none;
      background: linear-gradient(135deg, #1e1a60, #6a11cb);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      margin: 0;
      font-size: 15px;
      font-weight: bold;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(106, 17, 203, 0.4);
    }
    
    #clearBtn {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
    }
    
    #clearBtn:hover {
      box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
    }
    
    .table-container {
      overflow-x: auto;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }
    
    th {
      background: linear-gradient(135deg, #1e1a60, #6a11cb);
      color: white;
      padding: 15px;
      text-align: left;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    
    td {
      padding: 15px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    
    tr:hover {
      background: linear-gradient(90deg, rgba(106, 17, 203, 0.05), transparent);
    }
    
    tr:last-child td {
      border-bottom: none;
    }
    
    .yes {
      color: #d32f2f;
      font-weight: bold;
      background: rgba(211, 47, 47, 0.1);
      padding: 4px 10px;
      border-radius: 5px;
      display: inline-block;
    }
    
    .no {
      color: #388e3c;
      font-weight: bold;
      background: rgba(56, 142, 60, 0.1);
      padding: 4px 10px;
      border-radius: 5px;
      display: inline-block;
    }
    
    .no-data {
      text-align: center;
      padding: 50px;
      color: #999;
      font-style: italic;
      font-size: 16px;
    }
    
    .loading {
      text-align: center;
      padding: 50px;
      color: #666;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid rgba(106, 17, 203, 0.2);
      border-top-color: #6a11cb;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error-message {
      background: rgba(211, 47, 47, 0.1);
      border-left: 4px solid #d32f2f;
      color: #d32f2f;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
      font-weight: bold;
    }
    
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .stat-card {
      background: linear-gradient(135deg, #1e1a60, #6a11cb);
      color: white;
      padding: 20px 30px;
      border-radius: 10px;
      text-align: center;
      min-width: 150px;
      box-shadow: 0 4px 15px rgba(106, 17, 203, 0.3);
    }
    
    .stat-card h4 {
      font-size: 13px;
      margin-bottom: 8px;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .stat-card span {
      font-size: 28px;
      font-weight: bold;
      display: block;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }
      
      h2 {
        font-size: 24px;
      }
      
      th, td {
        padding: 10px 8px;
        font-size: 12px;
      }
      
      button {
        padding: 10px 18px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fas fa-brain"></i> Brain Tumor Analysis History</h2>

    <div class="stats">
      <div class="stat-card">
        <h4>Total Analyses</h4>
        <span id="totalAnalyses">0</span>
      </div>
      <div class="stat-card">
        <h4>Tumors Detected</h4>
        <span id="tumorsDetected">0</span>
      </div>
      <div class="stat-card">
        <h4>No Tumors</h4>
        <span id="noTumors">0</span>
      </div>
    </div>

    <div class="actions">
      <button onclick="window.location.href='index.html'">
        <i class="fas fa-home"></i> Home
      </button>
      <button onclick="loadHistory()">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
      <button id="clearBtn">
        <i class="fas fa-trash-alt"></i> Clear All History
      </button>
    </div>

    <div class="table-container">
      <table id="historyTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Filename</th>
            <th>Result</th>
            <th>Confidence</th>
            <th>Date & Time</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <tr>
            <td colspan="5" class="loading">
              <div class="spinner"></div>
              Loading history...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Load history on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadHistory();
    });

    async function loadHistory() {
      const tbody = document.getElementById('historyTableBody');
      tbody.innerHTML = '<tr><td colspan="5" class="loading"><div class="spinner"></div>Loading history...</td></tr>';

      try {
        const res = await fetch('/analysis-history');
        
        if (res.status === 403) {
          tbody.innerHTML = '<tr><td colspan="5" class="error-message">Access Denied: Admin privileges required to view history.</td></tr>';
          return;
        }

        const data = await res.json();

        if (!data.success) {
          tbody.innerHTML = `<tr><td colspan="5" class="error-message">Error: ${data.message || 'Failed to load history'}</td></tr>`;
          return;
        }

        const analyses = data.analyses || [];
        
        // Update stats
        document.getElementById('totalAnalyses').textContent = analyses.length;
        document.getElementById('tumorsDetected').textContent = analyses.filter(a => a.analysisResult.tumorDetected).length;
        document.getElementById('noTumors').textContent = analyses.filter(a => !a.analysisResult.tumorDetected).length;

        if (analyses.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="no-data"><i class="fas fa-inbox"></i><br><br>No analysis history available yet.<br>Start by uploading images from the home page.</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        analyses.forEach((a, index) => {
          const tr = document.createElement('tr');
          const resultClass = a.analysisResult.tumorDetected ? 'yes' : 'no';
          const resultText = a.analysisResult.tumorDetected ? 'Tumor Detected' : 'No Tumor';
          const date = new Date(a.createdAt).toLocaleString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          tr.innerHTML = `
            <td><strong>${index + 1}</strong></td>
            <td><i class="fas fa-file-image"></i> ${a.originalName || a.filename}</td>
            <td><span class="${resultClass}">${resultText}</span></td>
            <td><strong>${a.analysisResult.confidence}%</strong></td>
            <td>${date}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Load history error:', err);
        tbody.innerHTML = '<tr><td colspan="5" class="error-message">Server error: Unable to connect. Please try again later.</td></tr>';
      }
    }

    async function clearHistory() {
      if (!confirm('⚠️ Are you sure you want to delete all analysis history?\n\nThis action cannot be undone!')) {
        return;
      }

      try {
        const res = await fetch('/clear-history', { method: 'DELETE' });
        const data = await res.json();

        if (data.success) {
          alert('✅ History cleared successfully!');
          loadHistory();
        } else {
          alert('❌ Failed to clear history: ' + (data.message || 'Unknown error'));
        }
      } catch (err) {
        console.error('Clear history error:', err);
        alert('❌ Server error while clearing history. Please try again.');
      }
    }

    document.getElementById('clearBtn').addEventListener('click', clearHistory);
  </script>
</body>
</html>
